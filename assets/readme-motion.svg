<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">Design, Code and Growth</title>
  <desc id="desc">Animated decorative line representing continuous development.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#111111" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#42A5F5"/>
      <stop offset="1" stop-color="#111111" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1200" height="180" fill="transparent"/>
  <path d="M80 90 C240 20 340 160 500 90 S760 20 920 90 S1080 160 1120 90" fill="none" stroke="#42A5F5" stroke-opacity=".16" stroke-width="18" filter="url(#blur)">
    <animate attributeName="stroke-opacity" values=".08;.28;.08" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M80 90 C240 20 340 160 500 90 S760 20 920 90 S1080 160 1120 90" fill="none" stroke="url(#g)" stroke-width="2" stroke-dasharray="18 12">
    <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="3s" repeatCount="indefinite"/>
  </path>
  <circle cx="80" cy="90" r="5" fill="#42A5F5">
    <animate attributeName="cx" values="80;1120;80" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;90;90" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="82" text-anchor="middle" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="4">DESIGN · CODE · GROWTH</text>
  <text x="600" y="112" text-anchor="middle" fill="#666666" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2">STILL LEARNING · STILL BUILDING · STILL EVOLVING</text>
</svg>
